name: Compilar APK Automático

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Crear archivo local.properties con secretos
      run: |
        echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> local.properties
        echo "SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> local.properties

    - name: Validar o Generar Gradle Wrapper
      run: |
        if [ ! -f gradlew ]; then
          echo "gradlew no encontrado, generando uno nuevo..."
          gradle wrapper
        fi
        chmod +x gradlew

    - name: Compilar APK (Modo Release)
      run: ./gradlew assembleRelease

    - name: Guardar el archivo APK generado
      uses: actions/upload-artifact@v4
      with:
        name: EcoPos-Release-APK
        path: app/build/outputs/apk/release/app-release-unsigned.apk
